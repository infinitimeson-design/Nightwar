<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="YP Product — animated camera banner">

  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a2012"/>
      <stop offset="100%" stop-color="#0E1109"/>
    </radialGradient>

    <radialGradient id="lensGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a4326"/>
      <stop offset="70%" stop-color="#161c0d"/>
      <stop offset="100%" stop-color="#0c0f07"/>
    </radialGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cdbd8e"/>
      <stop offset="100%" stop-color="#8c9458"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="url(#bgGlow)"/>

  <!-- ================= دوربین ================= -->
  <g transform="translate(190,130)">

    <!-- بدنه‌ی دوربین -->
    <rect x="-115" y="-58" width="230" height="120" rx="18"
          fill="none" stroke="#3a4128" stroke-width="2"/>

    <!-- برجستگی فلاش بالای دوربین -->
    <rect x="-40" y="-84" width="80" height="30" rx="8"
          fill="none" stroke="#3a4128" stroke-width="2"/>

    <!-- چراغ فلاش — چشمک می‌زنه -->
    <circle cx="14" cy="-69" r="5" fill="#f7f7f5" opacity="0">
      <animate attributeName="opacity"
               values="0;0;1;0;0"
               keyTimes="0;0.42;0.46;0.5;1"
               dur="4.4s"
               repeatCount="indefinite"/>
    </circle>

    <!-- هاله‌ی نور فلاش -->
    <circle cx="14" cy="-69" r="14" fill="#f7f7f5" opacity="0">
      <animate attributeName="opacity"
               values="0;0;.5;0;0"
               keyTimes="0;0.42;0.46;0.5;1"
               dur="4.4s"
               repeatCount="indefinite"/>
    </circle>

    <!-- حلقه‌ی بیرونی لنز -->
    <circle cx="0" cy="4" r="52" fill="url(#lensGlow)"
            stroke="url(#goldLine)" stroke-width="2.5"/>

    <circle cx="0" cy="4" r="40" fill="none"
            stroke="#4a5330" stroke-width="1.5"/>

    <!-- دیافراگم — می‌چرخه و باز و بسته میشه -->
    <g transform-origin="0 4">
      <animateTransform attributeName="transform"
                         type="rotate"
                         values="0 0 4;120 0 4;240 0 4;360 0 4"
                         dur="9s"
                         repeatCount="indefinite"/>

      <g transform="translate(0,4)">
        <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
                 fill="#12160b" stroke="url(#goldLine)" stroke-width="1.2">
          <animateTransform attributeName="transform"
                             type="scale"
                             values="1;0.32;1"
                             keyTimes="0;0.5;1"
                             dur="3s"
                             repeatCount="indefinite"/>
        </polygon>
      </g>
    </g>

    <!-- نقطه‌ی نور روی لنز -->
    <circle cx="-16" cy="-14" r="4" fill="#f2ecd8" opacity=".55"/>

  </g>

  <!-- ================= خط جداکننده ================= -->
  <line x1="345" y1="55" x2="345" y2="205"
        stroke="#2a2e1c" stroke-width="1"/>

  <!-- ================= وردمارک ================= -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f7f7f5">

    <text x="390" y="120" font-size="54" letter-spacing="4"
          opacity="0">
      YP
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.15;0.4;1"
               dur="4.4s"
               repeatCount="indefinite"/>
    </text>

    <text x="390" y="155" font-size="15" letter-spacing="2.5"
          fill="#8f8a7d" opacity="0">
      PRODUCT PHOTOGRAPHY STUDIO
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.25;0.5;1"
               dur="4.4s"
               repeatCount="indefinite"/>
    </text>

    <text x="390" y="185" font-size="13" letter-spacing="1"
          fill="#6f6a5d" font-style="italic" opacity="0">
      هر محصول، ارزش دیده شدن را دارد.
      <animate attributeName="opacity"
               values="0;0;0;1;1"
               keyTimes="0;0.35;0.5;0.65;1"
               dur="4.4s"
               repeatCount="indefinite"/>
    </text>

  </g>

</svg>
